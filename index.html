<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nitro Seed – 3D Combat Racer</title>
    <meta
      name="description"
      content="A modular multiplayer 3D top-down combat racer with procedural tracks."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="game-canvas"></canvas>

    <div id="loading-overlay" class="loading-overlay hidden">
      <div id="loading-player-list" class="loading-player-list"></div>
      <div class="loader-box">
        <div class="spinner"></div>
        <p id="loading-text">LOADING ASSETS...</p>
      </div>
    </div>

    <!-- ── MENU SCREEN ─────────────────────────────────────── -->
    <div id="screen-menu" class="screen active">
      <div class="menu-box">
        <h1 class="game-title">NITRO<br /><span class="title-seed">SEED</span></h1>
        <p class="subtitle">COMBAT RACER</p>
        <p class="version-label">v1.3.2</p>
        <div class="field-row">
          <div class="field-group half">
            <label for="player-name">YOUR NAME</label>
            <input
              id="player-name"
              type="text"
              maxlength="12"
              placeholder="DRIVER"
              spellcheck="false"
            />
          </div>
        </div>

        <div class="btn-row" style="flex-wrap: wrap;">
          <button id="btn-host" class="btn btn-primary">HOST GAME</button>
          <button id="btn-join" class="btn btn-secondary">JOIN GAME</button>
          <button id="btn-fullscreen" class="btn btn-secondary full-width" style="margin-top: 10px; display: none;">PLAY FULLSCREEN</button>
          <button id="btn-download-log" class="btn btn-secondary full-width" style="margin-top: 10px;">DOWNLOAD PROFILE LOG</button>
        </div>
        <div id="join-panel" class="hidden">
          <div class="field-group">
            <label for="join-peer-id">HOST PEER ID</label>
            <input id="join-peer-id" type="text" placeholder="PASTE ID HERE" spellcheck="false" />
          </div>
          <button id="btn-connect" class="btn btn-primary">CONNECT</button>
        </div>
        <p id="menu-status" class="status-msg"></p>
      </div>
    </div>

    <!-- ── JOIN LOBBY SCREEN (GUEST) ────────────────────────── -->
    <div id="screen-join-lobby" class="screen">
      <div class="menu-box">
        <h2 class="panel-title">JOIN LOBBY</h2>

        <div class="field-group">
          <label for="join-lobby-name">YOUR NAME</label>
          <input
            id="join-lobby-name"
            type="text"
            maxlength="12"
            placeholder="DRIVER"
            spellcheck="false"
          />
        </div>




        <div class="field-group">
          <label for="join-lobby-id-display">LOBBY NAME</label>
          <input
            id="join-lobby-id-display"
            type="text"
            readonly
            style="background: rgba(0, 0, 0, 0.3); border-color: #444"
          />
        </div>

        <button id="btn-join-lobby-connect" class="btn btn-primary full-width">CONNECT</button>
        <p id="join-lobby-status" class="status-msg"></p>
      </div>
    </div>

    <!-- ── LOBBY SCREEN ────────────────────────────────────── -->
    <div id="screen-lobby" class="screen">
      <div class="lobby-box">
        <h2 class="panel-title">LOBBY</h2>

        <div class="peer-display" style="margin-bottom: 15px">
          <label id="peer-id-label">LOBBY ID</label>
          <div class="peer-id-row">
            <span id="peer-id-display">CONNECTING...</span>
            <div style="display: flex; gap: 4px">
              <button id="btn-copy-id" class="btn btn-small" title="Copy ID">📋 ID</button>
              <button id="btn-share-link" class="btn btn-small" title="Copy share link">🔗 LINK</button>
            </div>
          </div>
        </div>

        <div id="host-controls" class="hidden">
          <div class="field-row">
            <div class="field-group half">
              <label for="seed-input">TRACK SEED</label>
              <input id="seed-input" type="number" min="1" max="999999" value="42069" />
            </div>
            <div class="field-group half">
              <label for="lap-input">LAPS (1-10)</label>
              <input id="lap-input" type="number" min="1" max="10" value="3" />
            </div>
          </div>
          <div class="field-group full-width" style="margin-bottom: 15px">
            <label
              for="drive-input"
              style="display: block; margin-bottom: 5px; color: #aaa; font-size: 10px"
              >DRIVE MODE</label
            >
            <select
              id="drive-input"
              style="
                width: 100%;
                padding: 10px;
                background: #222;
                color: #fff;
                border: 1px solid #444;
                font-family: inherit;
              "
            >
              <option value="4WD" selected>4WD (ALL-WHEEL DRIVE)</option>
              <option value="RWD">REAR DRIVE (RWD)</option>
              <option value="FWD">FRONT DRIVE (FWD)</option>
            </select>
          </div>
          <div class="field-group full-width" style="margin-bottom: 15px">
            <label
              for="handling-input"
              style="display: block; margin-bottom: 5px; color: #aaa; font-size: 10px"
              >HANDLING MODE</label
            >
            <select
              id="handling-input"
              style="
                width: 100%;
                padding: 10px;
                background: #222;
                color: #fff;
                border: 1px solid #444;
                font-family: inherit;
              "
            >
              <option value="Arcade">ARCADE (GRIPPY)</option>
              <option value="Rally" selected>RALLY (DRIFT)</option>
            </select>
          </div>
          <div class="field-group full-width" style="margin-bottom: 15px">
            <label
              for="collision-input"
              style="display: block; margin-bottom: 5px; color: #aaa; font-size: 10px"
              >COLLISION MODE</label
            >
            <select
              id="collision-input"
              style="
                width: 100%;
                padding: 10px;
                background: #222;
                color: #fff;
                border: 1px solid #444;
                font-family: inherit;
              "
            >
              <option value="fast">FAST (CLIENT-SIDE SYNC)</option>
              <option value="strict">STRICT (HOST-AUTHORITATIVE)</option>
              <option value="smooth">SMOOTH (HYBRID PHYSICS)</option>
              <option value="predict" selected>PREDICTION+SMOOTH BLEND</option>
              <option value="dynamic">FULL DYNAMIC</option>
              <option value="authoritative">AUTHORITATIVE</option>
            </select>
          </div>
        </div>

        <div class="car-selection-wrap">
          <label>CHOOSE YOUR RIDE</label>
          <div class="car-selector">
            <button id="btn-car-prev" class="btn btn-nav">◄</button>
            <div class="car-preview-container">
              <canvas id="car-preview-canvas" width="200" height="120" class="car-preview-canvas"></canvas>
              <div id="car-name-display" class="car-name-display">VOLKSWAGEN GOLF GTI 1976</div>
            </div>
            <button id="btn-car-next" class="btn btn-nav">►</button>
          </div>
        </div>


        <div class="player-list-wrap">
          <h3 class="list-title">PLAYERS</h3>
          <ul id="player-list"></ul>
        </div>

        <p id="lobby-status" class="status-msg"></p>

        <button id="btn-start" class="btn btn-primary full-width hidden" style="margin-top: 15px">
          START RACE
        </button>
      </div>
    </div>

    <!-- ── HUD (visible during RACING) ───────────────────────── -->
    <div id="hud" class="hidden">
      <div id="fps-counter">0 FPS</div>
      <div id="crosshair" class="hidden">
        <div class="ch-top-left"></div>
        <div class="ch-top-right"></div>
        <div class="ch-bottom-left"></div>
        <div class="ch-bottom-right"></div>
        <div class="ch-dot"></div>
      </div>
      <div id="hud-top-left">
        <div id="hud-position">P1</div>
        <div id="hud-lap">LAP 1/3</div>
        <div id="hud-time">00:00.000</div>
      </div>
      <div id="hud-top-right">
        <div id="hud-weapon">NO WEAPON</div>
        <div id="hud-ammo"></div>
      </div>
      <div id="hud-bottom">
        <div id="hud-speed-wrap">
          <span id="hud-speed">0</span>
          <span class="unit">KM/H</span>
        </div>
      </div>
      <button id="btn-download-log-hud" class="btn btn-secondary" style="position: absolute; bottom: 20px; left: 20px; font-size: 10px; padding: 5px 10px; z-index: 100;">DOWNLOAD COLLISION LOG</button>
      <div id="hud-recovery" class="hidden">⚠ RECOVERY...</div>

      <!-- Wrong Way Alert -->
      <div
        id="wrong-way-msg"
        class="hidden"
        style="
          position: absolute;
          top: 20%;
          width: 100%;
          text-align: center;
          color: #ff2222;
          font-size: 64px;
          text-shadow: 4px 4px 0 #000;
          z-index: 1000;
          animation: flash 0.5s infinite alternate;
          font-family: 'Press Start 2P', monospace;
        "
      >
        WRONG WAY!
      </div>

      <div id="hud-msg" class="hud-flash hidden"></div>
      <div id="split-time-msg" class="hud-flash hidden"></div>

      <button id="download-log-btn" style="position: absolute; top: 120px; right: 20px; z-index: 9999; padding: 5px 10px; background: rgba(255,0,0,0.5); color: white; border: 1px solid white; cursor: pointer; font-family: 'Space Mono', monospace; font-size: 12px; pointer-events: auto;">DOWNLOAD COLLISION LOG</button>
      
      <div id="speedometer">
        <div id="speed-value">0</div>
        <div id="speed-unit">KM/H</div>
      </div>


      <!-- Start Lights -->
      <div id="start-lights" class="hidden">
        <div class="light light-yellow" id="light-1"></div>
        <div class="light light-yellow" id="light-2"></div>
        <div class="light light-yellow" id="light-3"></div>
        <div class="light light-yellow" id="light-4"></div>
      </div>
      <div id="minimap-wrap">
        <canvas id="minimap-canvas" width="160" height="160"></canvas>
        <div class="minimap-label">MAP</div>
      </div>
      
      <!-- ── MOBILE CONTROLS ─────────────────────────────────── -->
      <div id="mobile-controls" style="display: none;">
        <!-- Left Joystick (Throttle/Brake) -->
        <div id="joystick-left" class="joystick-base">
          <div class="joystick-stick"></div>
        </div>
        
        <!-- Right Joystick (Steering) -->
        <div id="joystick-right" class="joystick-base">
          <div class="joystick-stick"></div>
        </div>
        
        <!-- Fire Button -->
        <button id="btn-mobile-fire" class="mobile-btn-fire">FIRE</button>
      </div>
    </div>

    <!-- Host in-race return-to-lobby button (fixed, always on top) -->
    <button
      id="btn-host-return-lobby"
      class="btn hidden"
      style="
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 3000;
        font-size: 8px;
        padding: 8px 14px;
        background: rgba(160, 10, 10, 0.85);
        border: 1px solid #ff4444;
        color: #fff;
        cursor: pointer;
        pointer-events: all;
      "
    >↩ LOBBY</button>

    <!-- ── FINISHED SCREEN ───────────────────────────────────── -->
    <div id="screen-finished" class="screen">
      <div class="menu-box">
        <h2 class="panel-title">RACE OVER!</h2>
        <ol id="results-list"></ol>
        <button id="btn-lobby" class="btn btn-primary">BACK TO LOBBY</button>
        <button id="btn-download-log-finished" class="btn btn-secondary full-width" style="margin-top: 10px;">DOWNLOAD PROFILE LOG</button>
      </div>
    </div>

    <!-- Return to lobby countdown overlay -->
    <div id="return-lobby-overlay" class="hidden" style="
      position:fixed;top:0;left:0;width:100%;height:100%;
      background:rgba(0,0,0,0.8);z-index:5000;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      font-family:'Press Start 2P',monospace;color:#ff4444;
    ">
      <div style="font-size:18px;margin-bottom:24px;letter-spacing:3px;">RETURNING TO LOBBY</div>
      <div id="return-lobby-countdown" style="font-size:72px;text-shadow:0 0 20px #ff4444;"></div>
    </div>

    <script type="module" src="main.js"></script>
  </body>
</html>
